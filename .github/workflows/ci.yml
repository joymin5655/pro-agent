name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Guard hook tests
        run: bash tests/test-guard-bash.sh
      - name: Session-start hook tests
        run: bash tests/test-session-start.sh
      - name: Structure checks
        run: python3 tests/validate-structure.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck hooks/*.sh tests/*.sh

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin (no login needed)
        run: CLAUDE_CONFIG_DIR="$(mktemp -d)" claude plugin validate --strict .
